# Dedicated loopback listener reached only by Cloudflare Tunnel (or another
# TLS-terminating proxy). Replace the server_name and ports via install.sh.
# The rate-limit key falls back to the socket address when the tunnel header
# is absent so a direct connection cannot bypass the limit.
map $http_cf_connecting_ip $cc_manager_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $cc_manager_client zone=cc_manager_login:1m rate=6r/m;

server {
    listen 127.0.0.1:__NGINX_PORT__;
    server_name __SERVER_NAME__;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/cc-manager.access.log;
    error_log /var/log/nginx/cc-manager.error.log;

    if ($http_x_forwarded_proto = http) {
        return 301 https://__SERVER_NAME__$request_uri;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/v1/auth/login {
        limit_req zone=cc_manager_login burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_manager_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_manager_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
    location /assets/ {
        # Hashed build artifacts: the application already sends immutable caching.
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $cc_manager_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
