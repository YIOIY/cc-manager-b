name: 上线

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yioiy/cc-manager-b

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend
        run: make go-vet go-test check-generated
      - name: Frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: meta
        run: echo "tag=sha-$(printf '%.12s' "${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:prod
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            REVISION=${{ github.sha }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
